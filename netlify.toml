[build]
base = "client"
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"

[[plugins]]
package = "@netlify/plugin-nextjs"

# --- PROXY TIL RAILWAY ---
[[redirects]]
from = "/api/*"
to = "https://wego-production.up.railway.app/api/:splat"
status = 200
force = true

[[redirects]]
from = "/images/*"
to = "https://wego-production.up.railway.app/images/:splat"
status = 200
force = true
